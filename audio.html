<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>仮想PC 音声</title>
<style>
  body { background:#111; color:#fff; font-family: sans-serif; display:flex; flex-direction:column;
         align-items:center; justify-content:center; height:100vh; margin:0; }
  audio { width: 80%; max-width: 400px; }
</style>
</head>
<body>
  <p>🔊 仮想PC 音声ストリーム</p>
  <audio id="a" controls autoplay></audio>
  <p id="status" style="font-size:12px;color:#999;margin-top:20px;">再生されない場合は再生ボタンを押してください</p>
  <script>
    // Derives the audio-stream URL from this page's own hostname instead of
    // hardcoding a specific Codespace name, so this file works unmodified
    // across any Codespace instance (this page is expected to be served on
    // port 8999, the audio stream on 8998; both auto-forwarded by Codespaces
    // with hostnames of the form "<name>-<port>.app.github.dev").
    // Override with ?host=... or ?port=... if your setup differs.
    const params = new URLSearchParams(window.location.search);
    let audioURL = params.get('host');
    if (!audioURL) {
      const audioPort = params.get('port') || '8998';
      const host = window.location.hostname.replace(/-\d+(?=\.)/, '-' + audioPort);
      audioURL = `${window.location.protocol}//${host}/stream.mp3`;
    }
    document.getElementById('a').src = audioURL;
    document.getElementById('status').textContent += ' (' + audioURL + ')';
  </script>
</body>
</html>
