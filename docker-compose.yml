services:
  virtual-pc:
    # Pinned to a persistent tag instead of :latest so a remote rebuild can't
    # silently pull a different image version. Bump deliberately when needed:
    # https://github.com/selkies-project/docker-selkies-egl-desktop/pkgs/container/nvidia-egl-desktop
    image: ghcr.io/selkies-project/nvidia-egl-desktop:24.04-20251107145813
    container_name: virtual-pc
    restart: unless-stopped
    shm_size: "2g"
    ports:
      # Web UI (open https://localhost:8080 in your browser)
      - "8080:8080"
      # Uncomment below if you enable the internal TURN server (see README)
      # - "3478:3478"
      # - "3478:3478/udp"
      # - "65532-65535:65532-65535"
      # - "65532-65535:65532-65535/udp"
    environment:
      TZ: "Asia/Tokyo"
      DISPLAY_SIZEW: "1920"
      DISPLAY_SIZEH: "1080"
      DISPLAY_REFRESH: "60"
      DISPLAY_DPI: "96"
      DISPLAY_CDEPTH: "24"
      # Login password for the Linux user AND the web UI (change this!)
      PASSWD: "${VPC_PASSWORD:-changeme123}"
      # Software video encoder: works with NO GPU. Options: x264enc, vp8enc, vp9enc
      SELKIES_ENCODER: "x264enc"
      SELKIES_VIDEO_BITRATE: "4000"
      SELKIES_FRAMERATE: "30"
      SELKIES_AUDIO_BITRATE: "128000"
      SELKIES_BASIC_AUTH_PASSWORD: "${VPC_PASSWORD:-changeme123}"
    healthcheck:
      test: ["CMD-SHELL", "code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8080/); [ -n \"$code\" ] && [ \"$code\" != '000' ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # If you HAVE an NVIDIA GPU + NVIDIA Container Toolkit installed, uncomment
    # the block below and set SELKIES_ENCODER to nvh264enc for hardware encoding.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
